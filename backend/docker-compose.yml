services:
  postgres:
    image: postgres:16
    container_name: vnw-resgate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vnw_resgate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sua_senha_aqui}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data